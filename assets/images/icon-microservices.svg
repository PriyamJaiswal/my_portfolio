<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="microGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0.2" stop-color="#FFDB6E"/>
      <stop offset="1" stop-color="#FFBC5E"/>
    </linearGradient>
  </defs>
  <!-- Central Hub / API Gateway -->
  <circle cx="20" cy="20" r="4.5" stroke="url(#microGrad)" stroke-width="2" fill="url(#microGrad)" fill-opacity="0.2"/>
  <!-- Top Node -->
  <circle cx="20" cy="7" r="3.5" stroke="url(#microGrad)" stroke-width="1.8" fill="#1e1e1f"/>
  <line x1="20" y1="10.5" x2="20" y2="15.5" stroke="url(#microGrad)" stroke-width="1.6" stroke-dasharray="2 2"/>
  <!-- Bottom Node -->
  <circle cx="20" cy="33" r="3.5" stroke="url(#microGrad)" stroke-width="1.8" fill="#1e1e1f"/>
  <line x1="20" y1="24.5" x2="20" y2="29.5" stroke="url(#microGrad)" stroke-width="1.6" stroke-dasharray="2 2"/>
  <!-- Left Node -->
  <circle cx="7" cy="20" r="3.5" stroke="url(#microGrad)" stroke-width="1.8" fill="#1e1e1f"/>
  <line x1="10.5" y1="20" x2="15.5" y2="20" stroke="url(#microGrad)" stroke-width="1.6" stroke-dasharray="2 2"/>
  <!-- Right Node -->
  <circle cx="33" cy="20" r="3.5" stroke="url(#microGrad)" stroke-width="1.8" fill="#1e1e1f"/>
  <line x1="24.5" y1="20" x2="29.5" y2="20" stroke="url(#microGrad)" stroke-width="1.6" stroke-dasharray="2 2"/>
</svg>
